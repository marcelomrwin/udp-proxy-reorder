services:
  sender:
    build:
      context: .
      dockerfile: Containerfile.${APP:-python}
    container_name: udp-sender
    cap_add: [NET_ADMIN]
    networks:
      front:
        ipv4_address: 10.10.1.2

  vswitch:
    build:
      context: .
      dockerfile: Containerfile.vswitch
    container_name: udp-vswitch
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      front:
        ipv4_address: 10.10.1.3
      back:
        ipv4_address: 10.10.2.2

  receiver:
    build:
      context: .
      dockerfile: Containerfile.${APP:-python}
    container_name: udp-receiver
    cap_add: [NET_ADMIN]
    networks:
      back:
        ipv4_address: 10.10.2.3

  proxy:
    build:
      context: .
      dockerfile: Containerfile.${APP:-python}
    container_name: udp-proxy
    cap_add: [NET_ADMIN]
    networks:
      back:
        ipv4_address: 10.10.2.4

networks:
  front:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
  back:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
